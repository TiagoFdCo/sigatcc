# Proxy reverso para o droplet. API e SPA ficam em origens separadas
# (ex.: api.sigatcc.com.br e app.sigatcc.com.br), conforme a decisao de usar CORS.
# Ajuste os "server_name" para os dominios reais assim que forem registrados.

server {
    listen 80;
    server_name api.sigatcc.com.br;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.sigatcc.com.br;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Nota: TLS (certbot/Let's Encrypt) entra depois que os dominios estiverem
# apontando para o droplet e o DNS tiver propagado (dependencia externa B3a).
