repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: pytest-check
        name: Testes rapidos do backend antes do commit
        entry: bash -c 'cd backend && pytest -m "not slow"'
        language: system
        pass_filenames: false
        files: ^backend/
