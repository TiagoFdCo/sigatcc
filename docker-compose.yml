# Base (producao): sem banco local. O backend usa o PostgreSQL gerenciado da
# DigitalOcean, informado em DATABASE_URL no .env.
# Em desenvolvimento, o docker-compose.override.yml e carregado automaticamente
# e acrescenta o PostgreSQL local, o runserver e o hot-reload.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: gunicorn sigatcc.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # endereco da API gravado no JavaScript durante o build (Vite)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    profiles: ["frontend"] # so existe depois que o projeto React for criado
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
